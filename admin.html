<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Event Ticketing - QR + Edit Approval + Search</title>
    <style>
        :root { --bg-dark: #0f172a; --bg-card: #1e293b; --bg-input: #334155; --text-primary: #f1f5f9; --text-secondary: #94a3b8; --accent: #3b82f6; --accent-hover: #2563eb; --danger: #ef4444; --success: #10b981; --warning: #f59e0b; --border: #475569; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-primary); display: flex; height: 100vh; overflow-x: hidden; }
        #login-section { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; background: radial-gradient(circle at top, #1e293b, #0f172a); }
        .login-card { background: var(--bg-card); padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 350px; text-align: center; border: 1px solid var(--border); }
        .login-card h2 { margin-bottom: 20px; color: var(--accent); }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 15px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; color: var(--text-primary); outline: none; transition: 0.3s; }
        input:focus, select:focus { border-color: var(--accent); }
        button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: var(--accent-hover); }
        button.btn-danger { background: var(--danger); width: auto; padding: 8px 12px; font-size: 12px; }
        button.btn-success { background: var(--success); width: auto; padding: 8px 12px; font-size: 12px; }
        button.btn-edit { background: var(--warning); width: auto; padding: 8px 12px; font-size: 12px; }
        button.btn-verify-all { background: var(--success); width: auto; padding: 10px 20px; font-size: 14px; }
        button.btn-qr { background: var(--accent); width: auto; padding: 8px 12px; font-size: 12px; }
        button.btn-scan { background: var(--success); width: auto; padding: 10px 20px; font-size: 14px; }
        button.btn-approve { background: var(--success); width: auto; padding: 8px 12px; font-size: 12px; }
        button.btn-reject { background: var(--danger); width: auto; padding: 8px 12px; font-size: 12px; }
        #app-section { display: none; width: 100%; }
        .sidebar { width: 260px; background: var(--bg-card); height: 100vh; padding: 20px 0; display: flex; flex-direction: column; border-right: 1px solid var(--border); flex-shrink: 0; overflow-y: auto; }
        .sidebar h1 { text-align: center; color: var(--accent); font-size: 20px; margin-bottom: 30px; }
        .nav-item { padding: 15px 25px; color: var(--text-secondary); cursor: pointer; transition: 0.3s; border-left: 4px solid transparent; }
        .nav-item:hover, .nav-item.active { background: var(--bg-input); color: var(--text-primary); border-left-color: var(--accent); }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        .header h2 { font-size: 24px; }
        .btn-add { background: var(--success); width: auto; padding: 10px 20px; }
        .table-container { background: var(--bg-card); border-radius: 8px; overflow-x: auto; border: 1px solid var(--border); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; white-space: nowrap; }
        th { background: var(--bg-input); color: var(--text-secondary); }
        tr:hover { background: rgba(255,255,255,0.03); }
        td:last-child { display: flex; gap: 8px; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 100; padding: 20px; }
        .modal { background: var(--bg-card); padding: 30px; border-radius: 8px; width: 100%; max-width: 500px; border: 1px solid var(--border); max-height: 90vh; overflow-y: auto; }
        .modal h3 { margin-bottom: 20px; color: var(--accent); }
        .form-group { flex: 1; margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 12px; color: var(--text-secondary); }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-cancel { background: var(--bg-input); width: 100%; }
        .btn-save { background: var(--accent); width: 100%; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-active { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge-inactive { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .badge-warning { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .badge-info { background: rgba(59, 130, 246, 0.2); color: var(--accent); }
        .badge-purple { background: rgba(139, 92, 246, 0.2); color: #a78bfa; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: var(--success); color: white; padding: 15px 25px; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: none; z-index: 200; }
        .table-img { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; }
        .table-qr { width: 60px; height: 60px; object-fit: contain; border-radius: 5px; background: white; padding: 2px; cursor: pointer; }
        .qr-preview { max-width: 300px; width: 100%; border: 4px solid var(--accent); border-radius: 12px; padding: 8px; background: white; }
        .verify-result { padding: 20px; border-radius: 8px; text-align: center; }
        .verify-result.valid { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success); }
        .verify-result.invalid { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); }
        .checkin-box { background: var(--bg-input); padding: 20px; border-radius: 8px; margin-bottom: 15px; }
        .checkin-box h4 { color: var(--accent); margin-bottom: 10px; }
        .checkin-box p { margin-bottom: 5px; }
        .alasan-box { background: var(--bg-input); padding: 12px; border-radius: 6px; margin: 8px 0; font-size: 13px; max-width: 400px; white-space: normal; word-break: break-word; }
        
        /* Search bar styles */
        .search-container { position: relative; margin-bottom: 20px; }
        .search-container input { margin-bottom: 0; padding-left: 40px; padding-right: 40px; border-radius: 6px; }
        .search-container .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); font-size: 1.1rem; pointer-events: none; }
        .search-container .clear-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); border: none; background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 1.4rem; display: none; width: auto; padding: 0 5px; }
        .search-container .clear-btn:hover { color: var(--accent); }
        .search-meta { font-size: 0.8rem; color: var(--text-secondary); margin-top: 6px; }
        .highlight { background-color: #fbbf24; color: #000; padding: 0 3px; border-radius: 3px; }
        .alert { padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .alert-info { background: rgba(59,130,246,0.1); color: var(--accent); border: 1px solid var(--accent); }
    </style>
</head>
<body>
    <div id="login-section">
        <div class="login-card">
            <h2>ADMIN LOGIN</h2>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button onclick="checkLogin()">Login</button>
        </div>
    </div>

    <div id="app-section">
        <div class="sidebar">
            <h1>EVENT PANEL</h1>
            <div class="nav-item active" onclick="switchPage('data-event', this)">DATA EVENT</div>
            <div class="nav-item" onclick="switchPage('input-produk', this)">INPUT TIKET</div>
            <div class="nav-item" onclick="switchPage('data-pesanan', this)">DATA PESANAN</div>
            <div class="nav-item" onclick="switchPage('verifikasi-pesanan', this)">VERIFIKASI BAYAR</div>
            <div class="nav-item" onclick="switchPage('izin-ubah', this)">IZIN UBAH PESANAN</div>
            <div class="nav-item" onclick="switchPage('scan-qr', this)">SCAN QR / CHECK-IN</div>
            <div class="nav-item" onclick="switchPage('laporan', this)">LAPORAN</div>
        </div>
        <div class="main-content">
            <div id="page-content"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <h3 id="modal-title">Form</h3>
            <div id="modal-body"></div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Batal</button>
                <button class="btn-save" id="btn-save-modal" onclick="saveData()">Simpan</button>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="qr-modal-overlay">
        <div class="modal" style="text-align:center;">
            <h3 id="qr-modal-title">QR Code</h3>
            <div id="qr-modal-body" style="text-align:center;"></div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeQRModal()">Tutup</button>
                <button class="btn-save" onclick="downloadQRFromModal()">Download</button>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="izin-modal-overlay">
        <div class="modal">
            <h3 id="izin-modal-title">Proses Izin Ubah Pesanan</h3>
            <div id="izin-modal-body"></div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeIzinModal()">Tutup</button>
            </div>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzbovt39rmQJ74Zo_WX3Z2Xgl5dU2oA8LPEUQrmdUWdapIWnEM4QmajT6POW-PG3O8t/exec'; // GANTI INI
    const VALID_USER = "Tian_XIRPL", VALID_PASS = "qwerty";
    let currentSheet = '', currentAction = '', currentEditId = '', autoRefreshInterval, currentQRUrl = '';
    
    // Cache data untuk search
    let cacheDataEvent = [], cacheDataTiket = [], cacheDataPesanan = [], cacheDataPayments = [], cacheDataIzin = [], cacheDataCheckIn = [], cacheDataLaporan = [];

    function checkLogin() {
        if (document.getElementById('username').value === VALID_USER && document.getElementById('password').value === VALID_PASS) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('app-section').style.display = 'flex';
            switchPage('data-event', document.querySelector('.nav-item'));
            startAutoRefresh();
        } else { alert('Username atau Password salah!'); }
    }

    function switchPage(page, elem) {
        document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
        elem.classList.add('active');
        const content = document.getElementById('page-content');
        
        if (page === 'data-event') {
            currentSheet = 'Sheet1';
            content.innerHTML = `<div class="header"><h2>Data Event</h2><div style="display:flex; gap:10px; flex-wrap:wrap;"><button class="btn-qr" onclick="generateAllQR('Sheet1')">Generate Semua QR</button><button class="btn-add" onclick="openModal('add-event')">+ Tambah Event</button></div></div>
                <div class="search-container"><span class="search-icon">🔍</span><input type="text" id="searchEvent" placeholder="Cari event berdasarkan ID atau nama..." oninput="filterTable('event')"><button class="clear-btn" onclick="clearSearchInput('searchEvent','event')">&times;</button><div id="searchEventMeta" class="search-meta"></div></div>
                <div class="table-container"><table id="table-event"><thead><tr><th>ID</th><th>Gambar</th><th>QR</th><th>Nama Event</th><th>Tanggal</th><th>Lokasi</th><th>Status</th><th>Aksi</th></tr></thead><tbody></tbody></table></div>`;
            loadData('Sheet1');
        } else if (page === 'input-produk') {
            currentSheet = 'Sheet2';
            content.innerHTML = `<div class="header"><h2>Input Tiket</h2><div style="display:flex; gap:10px; flex-wrap:wrap;"><button class="btn-qr" onclick="generateAllQR('Sheet2')">Generate Semua QR</button><button class="btn-add" onclick="openModal('add-produk')">+ Tambah Tiket</button></div></div>
                <div class="search-container"><span class="search-icon">🔍</span><input type="text" id="searchTiket" placeholder="Cari tiket berdasarkan ID atau nama..." oninput="filterTable('tiket')"><button class="clear-btn" onclick="clearSearchInput('searchTiket','tiket')">&times;</button><div id="searchTiketMeta" class="search-meta"></div></div>
                <div class="table-container"><table id="table-produk"><thead><tr><th>ID</th><th>Gambar</th><th>QR</th><th>Nama Tiket</th><th>Harga</th><th>Kuota</th><th>Status</th><th>Aksi</th></tr></thead><tbody></tbody></table></div>`;
            loadData('Sheet2');
        } else if (page === 'data-pesanan') {
            currentSheet = 'Sheet3';
            content.innerHTML = `<div class="header"><h2>Data Pesanan</h2><button class="btn-danger" style="width:auto; padding:10px 20px; font-size:14px;" onclick="deleteAllPesanan()">Hapus Semua</button></div>
                <div class="search-container"><span class="search-icon">🔍</span><input type="text" id="searchPesanan" placeholder="Cari pesanan berdasarkan ID atau nama pemesan..." oninput="filterTable('pesanan')"><button class="clear-btn" onclick="clearSearchInput('searchPesanan','pesanan')">&times;</button><div id="searchPesananMeta" class="search-meta"></div></div>
                <div class="table-container"><table id="table-pesanan"><thead><tr><th>ID Pesanan</th><th>Nama</th><th>Total</th><th>Tanggal</th><th>Status</th><th>Keterangan</th><th>Aksi</th></tr></thead><tbody></tbody></table></div>`;
            loadData('Sheet3');
        } else if (page === 'verifikasi-pesanan') {
            content.innerHTML = `<div class="header"><h2>Verifikasi Pembayaran</h2><button class="btn-verify-all" onclick="verifyAllPayments()">Verifikasi Semua</button></div>
                <div class="search-container"><span class="search-icon">🔍</span><input type="text" id="searchPayment" placeholder="Cari berdasarkan ID pesanan atau nama..." oninput="filterTable('payment')"><button class="clear-btn" onclick="clearSearchInput('searchPayment','payment')">&times;</button><div id="searchPaymentMeta" class="search-meta"></div></div>
                <div class="table-container"><table id="table-ajuan"><thead><tr><th>ID Pesanan</th><th>Nama</th><th>Total</th><th>Bukti</th><th>Aksi</th></tr></thead><tbody></tbody></table></div>`;
            loadPayments();
        } else if (page === 'izin-ubah') {
            content.innerHTML = `<div class="header"><h2>Izin Ubah Pesanan</h2></div>
                <div class="alert alert-info"><b>ℹ️ Informasi:</b> Daftar pesanan yang diajukan user untuk diubah. Setujui agar user dapat mengedit pesanannya. Jika ditolak, status kembali ke semula.</div>
                <div class="search-container"><span class="search-icon">🔍</span><input type="text" id="searchIzin" placeholder="Cari berdasarkan ID pesanan atau nama..." oninput="filterTable('izin')"><button class="clear-btn" onclick="clearSearchInput('searchIzin','izin')">&times;</button><div id="searchIzinMeta" class="search-meta"></div></div>
                <div class="table-container"><table id="table-izin"><thead><tr><th>ID Pesanan</th><th>Nama</th><th>Total</th><th>Alasan User</th><th>Aksi</th></tr></thead><tbody></tbody></table></div>
                <h3 style="margin-top:30px; color:var(--success);">Riwayat Izin Edit Diberikan</h3>
                <div class="search-container"><span class="search-icon">🔍</span><input type="text" id="searchIzinHistory" placeholder="Cari riwayat izin..." oninput="filterTable('izinHistory')"><button class="clear-btn" onclick="clearSearchInput('searchIzinHistory','izinHistory')">&times;</button><div id="searchIzinHistoryMeta" class="search-meta"></div></div>
                <div class="table-container"><table id="table-izin-granted"><thead><tr><th>ID Pesanan</th><th>Nama</th><th>Total</th><th>Keterangan</th><th>Status</th></tr></thead><tbody></tbody></table></div>`;
            loadIzinUbah();
        } else if (page === 'scan-qr') {
            content.innerHTML = `<div class="header"><h2>Scan QR & Check-In Tiket</h2></div>
                <div style="background: var(--bg-card); padding: 30px; border-radius: 8px; border: 1px solid var(--border);">
                    <h3 style="color: var(--accent); margin-bottom: 20px;">Manual Input ID Tiket</h3>
                    <div style="display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;">
                        <input type="text" id="manual-id-tiket" placeholder="Masukkan ID Tiket (cth: TKT001)" style="margin-bottom:0; flex:1; min-width:200px;">
                        <button class="btn-scan" onclick="verifyTicketManual()" style="width:auto; padding:12px 20px;">Cek Tiket</button>
                    </div>
                    <div id="verify-result" style="margin-top:20px;"></div>
                </div>
                <div style="background: var(--bg-card); padding: 30px; border-radius: 8px; border: 1px solid var(--border); margin-top:20px;">
                    <h3 style="color: var(--accent); margin-bottom: 15px;">Riwayat Check-In Terbaru</h3>
                    <div class="search-container"><span class="search-icon">🔍</span><input type="text" id="searchCheckIn" placeholder="Cari check-in berdasarkan ID atau nama..." oninput="filterTable('checkIn')"><button class="clear-btn" onclick="clearSearchInput('searchCheckIn','checkIn')">&times;</button><div id="searchCheckInMeta" class="search-meta"></div></div>
                    <div class="table-container"><table id="table-checkin"><thead><tr><th>ID Pesanan</th><th>Nama</th><th>ID Tiket</th><th>Status</th><th>Keterangan</th></tr></thead><tbody></tbody></table></div>
                </div>`;
            loadCheckInHistory();
        } else if (page === 'laporan') {
            content.innerHTML = `<div class="header"><h2>Laporan Penjualan</h2></div>
                <div class="search-container"><span class="search-icon">🔍</span><input type="text" id="searchLaporan" placeholder="Cari laporan berdasarkan ID atau nama..." oninput="filterTable('laporan')"><button class="clear-btn" onclick="clearSearchInput('searchLaporan','laporan')">&times;</button><div id="searchLaporanMeta" class="search-meta"></div></div>
                <div class="table-container"><table id="table-laporan"><thead><tr><th>ID Pesanan</th><th>Nama</th><th>Total</th><th>Status</th></tr></thead><tbody></tbody></table></div>`;
            loadLaporan();
        }
    }

    async function loadData(sheetName) {
        try {
            const res = await fetch(`${SCRIPT_URL}?action=getData&sheet=${sheetName}`);
            const data = await res.json();
            if (data.success) {
                if (sheetName === 'Sheet1') { cacheDataEvent = data.data || []; filterTable('event'); }
                else if (sheetName === 'Sheet2') { cacheDataTiket = data.data || []; filterTable('tiket'); }
                else if (sheetName === 'Sheet3') { cacheDataPesanan = data.data || []; filterTable('pesanan'); }
            }
        } catch (err) { console.error('Error:', err); }
    }

    // =====================================================
    // SEARCH FUNCTIONS
    // =====================================================
    function clearSearchInput(inputId, type) {
        const input = document.getElementById(inputId);
        input.value = '';
        const clearBtn = input.parentElement.querySelector('.clear-btn');
        if (clearBtn) clearBtn.style.display = 'none';
        filterTable(type);
    }

    function toggleClearBtnAdmin(input) {
        const clearBtn = input.parentElement.querySelector('.clear-btn');
        if (clearBtn) clearBtn.style.display = input.value ? 'block' : 'none';
    }

    function highlightAdmin(text, query) {
        if (!query || !text) return esc(text);
        const regex = new RegExp('(' + escapeRegExp(query) + ')', 'gi');
        return esc(text).replace(regex, '<span class="highlight">$1</span>');
    }

    function escapeRegExp(string) { return String(string).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

    function filterTable(type) {
        const queryMap = {
            event: 'searchEvent', tiket: 'searchTiket', pesanan: 'searchPesanan',
            payment: 'searchPayment', izin: 'searchIzin', izinHistory: 'searchIzinHistory',
            checkIn: 'searchCheckIn', laporan: 'searchLaporan'
        };
        const inputId = queryMap[type];
        if (!inputId) return;
        const input = document.getElementById(inputId);
        if (!input) return;
        const query = input.value.trim().toLowerCase();
        toggleClearBtnAdmin(input);
        
        let source = [], filtered = [];
        switch(type) {
            case 'event': source = cacheDataEvent; break;
            case 'tiket': source = cacheDataTiket; break;
            case 'pesanan': source = cacheDataPesanan; break;
            case 'payment': source = cacheDataPayments; break;
            case 'izin': source = cacheDataIzin.filter(x => x.STATUS === "Menunggu Izin Ubah"); break;
            case 'izinHistory': source = cacheDataIzin.filter(x => x.STATUS === "Izin Edit Diberikan" || (x.ALASAN_UBAH && (x.ALASAN_UBAH.includes("IZIN DIBERIKAN ADMIN") || x.ALASAN_UBAH.includes("IZIN DITOLAK ADMIN")))); break;
            case 'checkIn': source = cacheDataCheckIn; break;
            case 'laporan': source = cacheDataLaporan; break;
        }
        
        if (query) {
            filtered = source.filter(row => {
                const fields = Object.values(row).map(v => String(v || '').toLowerCase());
                return fields.some(val => val.includes(query));
            });
        } else {
            filtered = source;
        }
        
        const metaId = inputId + 'Meta';
        const meta = document.getElementById(metaId);
        if (meta) {
            if (query) meta.innerHTML = `🔍 Menampilkan <b>${filtered.length}</b> dari <b>${source.length}</b> data`;
            else meta.innerHTML = '';
        }
        
        // Render hasil
        if (type === 'event') renderTable('Sheet1', filtered, query);
        else if (type === 'tiket') renderTable('Sheet2', filtered, query);
        else if (type === 'pesanan') renderTable('Sheet3', filtered, query);
        else if (type === 'payment') renderPayments(filtered, query);
        else if (type === 'izin') renderIzinTunggu(filtered, query);
        else if (type === 'izinHistory') renderIzinHistory(filtered, query);
        else if (type === 'checkIn') renderCheckIn(filtered, query);
        else if (type === 'laporan') renderLaporan(filtered, query);
    }

    function extractGoogleDriveId(url) {
        if (!url) return "";
        const text = String(url).trim();
        const patterns = [/\/file\/d\/([a-zA-Z0-9_-]+)/i, /\/d\/([a-zA-Z0-9_-]+)/i, /[?&]id=([a-zA-Z0-9_-]+)/i];
        for (const p of patterns) { const m = text.match(p); if (m && m[1]) return m[1]; }
        return "";
    }

    function fixImgUrl(url, size = "400x200") {
        const placeholder = `https://placehold.co/${size}/f1f5f9/64748b?text=No+Image`;
        if (url === null || url === undefined) return placeholder;
        let raw = String(url).trim();
        if (!raw) return placeholder;
        const urlMatch = raw.match(/https?:\/\/[^\s"'<>]+/i);
        let u = (urlMatch ? urlMatch[0] : raw).trim().replace(/^[("'`\s]+|[)"'`,;\s]+$/g, "");
        if (/^data:image\/[a-zA-Z0-9.+-]+;base64,/i.test(u)) return u;
        if (!/^https?:\/\//i.test(u)) return placeholder;
        try {
            const parsed = new URL(u);
            const host = parsed.hostname.toLowerCase();
            const googleId = extractGoogleDriveId(u);
            if (googleId && (host.includes("drive.google.com") || host.includes("docs.google.com") || host.includes("googleusercontent.com"))) return `https://drive.google.com/thumbnail?id=${encodeURIComponent(googleId)}&sz=w1200`;
            if (host.includes("encrypted-tbn") || host.includes("googleusercontent.com")) return u;
            if (host.includes("dropbox.com")) { parsed.searchParams.delete("dl"); parsed.searchParams.set("raw", "1"); return parsed.toString(); }
            return u;
        } catch (error) { return placeholder; }
    }

    }

    function normalizeDate(value) {
        if (!value) return '';
        const text = String(value).trim();
        const match = text.match(/^(\d{4}-\d{2}-\d{2})/);
        if (match) return match[1];
        const date = new Date(text);
        if (Number.isNaN(date.getTime())) return '';
        return date.toISOString().slice(0, 10);
    }

                modalTitle.innerText = action === 'add-produk' ? 'Tambah Tiket' : 'Edit Tiket';
                const [resEvent, resTiket] = await Promise.all([fetch(`${SCRIPT_URL}?action=getData&sheet=Sheet1`).then(r => r.json()), fetch(`${SCRIPT_URL}?action=getData&sheet=Sheet2`).then(r => r.json())]);
                const events = resEvent.success ? (resEvent.data || []) : [];
                const d = action === 'edit-produk' ? findById(resTiket.data, 'ID_TIKET', id) : null;
                if (action === 'edit-produk' && !d) { modalBody.innerHTML = '<p>Data tidak ditemukan.</p>'; return; }
                let eventOptions = '<option value="">Pilih Event...</option>';
                events.forEach(ev => { const selected = d && String(d.ID_EVENT).trim() === String(ev.ID_EVENT).trim() ? 'selected' : ''; eventOptions += `<option value="${esc(ev.ID_EVENT)}" ${selected}>${esc(ev.ID_EVENT)} - ${esc(ev.NAMA_EVENT)}</option>`; });
                modalBody.innerHTML = `<div class="form-group"><label>ID Tiket *</label><input type="text" id="m_ID_TIKET" value="${esc(d?.ID_TIKET)}" ${d ? 'disabled' : ''} placeholder="TKT001"></div><div class="form-group"><label>Pilih Event *</label><select id="m_ID_EVENT">${eventOptions}</select></div><div class="form-group"><label>Nama Tiket *</label><input type="text" id="m_NAMA_TIKET" value="${esc(d?.NAMA_TIKET)}"></div><div class="form-group"><label>Harga</label><input type="number" id="m_HARGA" value="${esc(d?.HARGA)}"></div><div class="form-group"><label>Kuota</label><input type="number" id="m_KUOTA" value="${esc(d?.KUOTA)}"></div><div class="form-group"><label>Deskripsi</label><input type="text" id="m_DESKRIPSI" value="${esc(d?.DESKRIPSI)}"></div><div class="form-group"><label>URL Gambar</label><input type="text" id="m_GAMBAR" value="${esc(d?.GAMBAR)}" placeholder="https://..."></div><div class="form-group"><label>Status</label><select id="m_STATUS"><option value="AKTIF" ${d && String(d.STATUS).toUpperCase() === 'AKTIF' ? 'selected' : ''}>AKTIF</option><option value="NONAKTIF" ${d && String(d.STATUS).toUpperCase() === 'NONAKTIF' ? 'selected' : ''}>NONAKTIF</option></select></div>`;
                return;
            }
            if (action === 'edit-pesanan') {
                modalTitle.innerText = 'Edit Status Pesanan';
                const res = await fetch(`${SCRIPT_URL}?action=getData&sheet=Sheet3`).then(r => r.json());
                const d = findById(res.data, 'ID_PESANAN', id);
                if (!d) { modalBody.innerHTML = '<p>Data tidak ditemukan.</p>'; return; }
                modalBody.innerHTML = `<div class="form-group"><label>Nama Pemesan</label><input type="text" id="m_NAMA_PEMESAN" value="${esc(d.NAMA_PEMESAN)}"></div><div class="form-group"><label>Jumlah</label><input type="number" id="m_JUMLAH" value="${esc(d.JUMLAH)}"></div><div class="form-group"><label>Status</label><select id="m_STATUS"><option value="Menunggu Verifikasi Admin" ${d.STATUS === 'Menunggu Verifikasi Admin' ? 'selected' : ''}>Menunggu Verifikasi</option><option value="Lunas" ${d.STATUS === 'Lunas' ? 'selected' : ''}>Lunas</option><option value="Check-In" ${d.STATUS === 'Check-In' ? 'selected' : ''}>Check-In</option><option value="Menunggu Izin Ubah" ${d.STATUS === 'Menunggu Izin Ubah' ? 'selected' : ''}>Menunggu Izin Ubah</option><option value="Izin Edit Diberikan" ${d.STATUS === 'Izin Edit Diberikan' ? 'selected' : ''}>Izin Edit Diberikan</option><option value="Batal" ${d.STATUS === 'Batal' ? 'selected' : ''}>Batal</option></select></div>`;
            }
        } catch (error) { modalBody.innerHTML = '<p style="color:red">Gagal memuat data.</p>'; }
    }

    function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }

    async function saveData() {
        const btn = document.getElementById('btn-save-modal'); btn.disabled = true; btn.innerHTML = 'Menyimpan...';
        let payload = {}, postBody = {};
        if (currentAction === 'add-event') { payload = { ID_EVENT: document.getElementById('m_ID_EVENT').value, NAMA_EVENT: document.getElementById('m_NAMA_EVENT').value, TANGGAL: document.getElementById('m_TANGGAL').value, LOKASI: document.getElementById('m_LOKASI').value, DESKRIPSI_ACARA: document.getElementById('m_DESKRIPSI_ACARA').value, GAMBAR: document.getElementById('m_GAMBAR').value, STATUS: document.getElementById('m_STATUS').value }; postBody = { action: 'addData', sheet: 'Sheet1', payload: payload }; }
        else if (currentAction === 'edit-event') { payload = { NAMA_EVENT: document.getElementById('m_NAMA_EVENT').value, TANGGAL: document.getElementById('m_TANGGAL').value, LOKASI: document.getElementById('m_LOKASI').value, DESKRIPSI_ACARA: document.getElementById('m_DESKRIPSI_ACARA').value, GAMBAR: document.getElementById('m_GAMBAR').value, STATUS: document.getElementById('m_STATUS').value }; postBody = { action: 'updateData', sheet: 'Sheet1', idCol: 'ID_EVENT', idVal: currentEditId, payload: payload }; }
        else if (currentAction === 'add-produk') { payload = { ID_TIKET: document.getElementById('m_ID_TIKET').value, ID_EVENT: document.getElementById('m_ID_EVENT').value, NAMA_TIKET: document.getElementById('m_NAMA_TIKET').value, HARGA: document.getElementById('m_HARGA').value, KUOTA: document.getElementById('m_KUOTA').value, DESKRIPSI: document.getElementById('m_DESKRIPSI').value, GAMBAR: document.getElementById('m_GAMBAR').value, STATUS: document.getElementById('m_STATUS').value }; postBody = { action: 'addData', sheet: 'Sheet2', payload: payload }; }
        else if (currentAction === 'edit-produk') { payload = { ID_EVENT: document.getElementById('m_ID_EVENT').value, NAMA_TIKET: document.getElementById('m_NAMA_TIKET').value, HARGA: document.getElementById('m_HARGA').value, KUOTA: document.getElementById('m_KUOTA').value, DESKRIPSI: document.getElementById('m_DESKRIPSI').value, GAMBAR: document.getElementById('m_GAMBAR').value, STATUS: document.getElementById('m_STATUS').value }; postBody = { action: 'updateData', sheet: 'Sheet2', idCol: 'ID_TIKET', idVal: currentEditId, payload: payload }; }
        else if (currentAction === 'edit-pesanan') { payload = { NAMA_PEMESAN: document.getElementById('m_NAMA_PEMESAN').value, JUMLAH: document.getElementById('m_JUMLAH').value, STATUS: document.getElementById('m_STATUS').value }; postBody = { action: 'updateData', sheet: 'Sheet3', idCol: 'ID_PESANAN', idVal: currentEditId, payload: payload }; }
        try {
            const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(postBody) });
            const data = await res.json();
            if(data.success) { showToast(data.message, "success"); closeModal(); loadData(currentSheet); }
            else { showToast("Error: " + data.message, "error"); }
        } catch (err) { showToast("Gagal terhubung ke server.", "error"); }
        btn.disabled = false; btn.innerHTML = 'Simpan';
    }

    async function deleteRecord(sheet, idCol, idVal) {
        if (!confirm(`Yakin hapus data ${idVal}?`)) return;
        if (sheet === 'Sheet1' && idCol === 'ID_EVENT') {
            try {
                const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'deleteEventWithRelations', idVal: idVal }) });
                const data = await res.json();
                if(data.success) { showToast("Event & relasi berhasil dihapus", "success"); loadData('Sheet1'); }
                else { showToast("Error: " + data.message, "error"); }
            } catch(e) { showToast("Gagal menghapus data", "error"); }
            return;
        }
        try {
            const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'deleteData', sheet: sheet, idCol: idCol, idVal: idVal }) });
            const data = await res.json();
            if(data.success) { showToast("Data dihapus", "success"); loadData(currentSheet); }
        } catch (err) { showToast("Gagal menghapus.", "error"); }
    }

    async function deleteAllPesanan() {
        if (!confirm("Yakin ingin menghapus SEMUA data pesanan?")) return;
        try {
            const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'deleteAllPesanan' }) });
            const data = await res.json();
            if(data.success) { showToast("Semua pesanan dihapus", "success"); loadData('Sheet3'); }
            else { showToast("Error: " + data.message, "error"); }
        } catch(e) { showToast("Gagal menghapus data", "error"); }
    }

    function startAutoRefresh() {
        autoRefreshInterval = setInterval(() => {
            const activePage = document.querySelector('.nav-item.active')?.textContent || '';
            if(activePage.includes('DATA EVENT')) loadData('Sheet1');
            else if(activePage.includes('INPUT TIKET')) loadData('Sheet2');
            else if(activePage.includes('DATA PESANAN')) loadData('Sheet3');
            else if(activePage.includes('VERIFIKASI')) loadPayments();
            else if(activePage.includes('IZIN UBAH')) loadIzinUbah();
            else if(activePage.includes('SCAN QR')) loadCheckInHistory();
            else if(activePage.includes('LAPORAN')) loadLaporan();
        }, 15000);
    }

    function showToast(msg, type = 'success') {
        const toast = document.getElementById('toast'); toast.innerText = msg;
        toast.style.background = type === 'error' ? 'var(--danger)' : 'var(--success)';
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    async function loadLaporan() {
        try {
            const res = await fetch(`${SCRIPT_URL}?action=getData&sheet=Sheet3`);
            const data = await res.json();
            cacheDataLaporan = data.data || [];
            filterTable('laporan');
        } catch (err) { console.error('Error laporan:', err); }
    }

    function renderLaporan(data, query = '') {
        const tbody = document.querySelector('#table-laporan tbody');
        if (!tbody) return;
        tbody.innerHTML = '';
        let totalLunas = 0;
        data.forEach(row => {
            let status = row.STATUS ? row.STATUS.toUpperCase() : '';
            let harga = parseInt(row['TOTAL_HARGA'] || 0);
            if(status === 'LUNAS') totalLunas += harga;
            let badgeClass = status === 'LUNAS' ? 'badge-active' : (status === 'BATAL' ? 'badge-inactive' : (status === 'CHECK-IN' ? 'badge-info' : 'badge-warning'));
            tbody.innerHTML += `<tr><td>${highlightAdmin(row.ID_PESANAN, query)}</td><td>${highlightAdmin(row.NAMA_PEMESAN, query)}</td><td>Rp ${harga.toLocaleString('id-ID')}</td><td><span class="badge ${badgeClass}">${highlightAdmin(row.STATUS, query)}</span></td></tr>`;
        });
        tbody.innerHTML += `<tr style="font-weight:bold; color: var(--success);"><td colspan="2">TOTAL PENDAPATAN (LUNAS)</td><td>Rp ${totalLunas.toLocaleString('id-ID')}</td><td></td></tr>`;
    }
</script>
</body>
</html>
